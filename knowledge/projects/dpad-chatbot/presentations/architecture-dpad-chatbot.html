<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arsitektur Konseptual · Chatbot DPAD</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #ffffff; /* Background putih */
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #7a8399;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: #ffffff; /* Background putih */
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Arsitektur Konseptual · Diagram Design</p>
    <h1>Arsitektur Konseptual Chatbot DPAD</h1>

    <svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch-title arch-desc">
      <title id="arch-title">Arsitektur Konseptual Chatbot DPAD</title>
      <desc id="arch-desc">Diagram konseptual high-level. Pengguna mengakses Landing Page DPAD, menekan tombol Tanya DPAD untuk membuka Chatbot DPAD, yang menggunakan Knowledge Base disediakan oleh CMS (domain TLab, ditandai coral), sementara aplikasi di-host pada environment Komdigi.</desc>

      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- ============ ZONES (grouping) ============ -->
      <!-- Zone A: DPAD SITE · EXISTING (netral) -->
      <rect x="48" y="76" width="636" height="156" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="64" y="80" width="184" height="12" rx="2" fill="#f5f5f5"/>
      <text x="156" y="89" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DPAD SITE · EXISTING</text>

      <!-- Zone B: KNOWLEDGE · TLAB (coral-tinted → domain TLab: CMS & Knowledge Base) -->
      <rect x="48" y="352" width="508" height="156" rx="8" fill="rgba(235,108,54,0.05)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="64" y="356" width="188" height="12" rx="2" fill="#f5f5f5"/>
      <text x="158" y="365" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">KNOWLEDGE · TLAB</text>

      <!-- Zone C: HOSTING · KOMDIGI (netral) -->
      <rect x="696" y="352" width="264" height="156" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="712" y="356" width="180" height="12" rx="2" fill="#f5f5f5"/>
      <text x="802" y="365" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">HOSTING · KOMDIGI</text>

      <!-- ============ ARROWS (drawn behind nodes) ============ -->
      <!-- User -> Landing Page (HTTPS access) -->
      <line x1="224" y1="148" x2="296" y2="148" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- Landing Page -> Tanya DPAD button -->
      <line x1="500" y1="148" x2="552" y2="148" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <!-- Tanya DPAD button -> Chatbot DPAD (primary flow) -->
      <line x1="672" y1="148" x2="700" y2="148" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- CMS -> Knowledge Base -->
      <line x1="280" y1="424" x2="332" y2="424" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Knowledge Base -> Chatbot DPAD (uses knowledge) -->
      <path d="M 436,384 V 296 H 752 Q 760,296 760,288 V 188" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Chatbot DPAD -> Knowledge Base (conceptual, two-way) -->
      <path d="M 700,200 V 320 H 428 Q 420,320 420,312 V 384" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- Chatbot DPAD -> Komdigi (deployment) -->
      <line x1="828" y1="188" x2="828" y2="380" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ============ ARROW LABELS ============ -->
      <rect x="232" y="140" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="260" y="149" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AKSES</text>

      <rect x="600" y="124" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="648" y="133" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BUKA CHATBOT</text>

      <rect x="284" y="416" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="312" y="425" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KELOLA</text>

      <rect x="496" y="280" width="128" height="12" rx="2" fill="#f5f5f5"/>
      <text x="560" y="289" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SUMBER KNOWLEDGE</text>

      <rect x="500" y="328" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="552" y="337" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">(konseptual)</text>

      <rect x="836" y="278" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="868" y="287" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DI-HOST</text>

      <!-- ============ NODES ============ -->
      <!-- Node: Pengguna (input / external) -->
      <rect x="80" y="108" width="144" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="80" y="108" width="144" height="80" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="88" y="116" width="44" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="110" y="125" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
      <text x="152" y="152" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pengguna</text>
      <text x="152" y="168" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Masyarakat</text>

      <!-- Node: Landing Page DPAD (existing / backend — domain DPAD, zona netral) -->
      <rect x="300" y="108" width="200" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="300" y="108" width="200" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="308" y="116" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="330" y="125" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXISTING</text>
      <text x="400" y="152" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Landing Page DPAD</text>
      <text x="400" y="168" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">website resmi</text>

      <!-- Node: Tombol "Tanya DPAD" (to be developed, optional) -->
      <rect x="556" y="128" width="116" height="40" rx="20" fill="#f5f5f5"/>
      <rect x="556" y="128" width="116" height="40" rx="20" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="614" y="146" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tanya DPAD</text>
      <text x="614" y="160" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">TO BE DEVELOPED</text>

      <!-- Node: Chatbot DPAD (focal / to be developed) -->
      <rect x="704" y="108" width="232" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="704" y="108" width="232" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="712" y="116" width="44" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="734" y="125" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DEV</text>
      <text x="820" y="152" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chatbot DPAD</text>
      <text x="820" y="168" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">interface · to be developed</text>

      <!-- Node: CMS (existing — domain TLab, zona coral) -->
      <rect x="80" y="384" width="200" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="80" y="384" width="200" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <!-- TLab domain badge (coral) -->
      <rect x="88" y="392" width="56" height="12" rx="6" fill="rgba(235,108,54,0.12)" stroke="#eb6c36" stroke-width="0.8"/>
      <text x="116" y="401" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TLAB</text>
      <rect x="152" y="392" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="180" y="401" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXISTING</text>
      <text x="180" y="428" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CMS</text>
      <text x="180" y="444" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kelola konten</text>

      <!-- Node: Knowledge Base (existing knowledge — domain TLab, zona coral) -->
      <rect x="336" y="384" width="200" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="336" y="384" width="200" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <!-- TLab domain badge (coral) + knowledge tag -->
      <rect x="344" y="392" width="56" height="12" rx="6" fill="rgba(235,108,54,0.12)" stroke="#eb6c36" stroke-width="0.8"/>
      <text x="372" y="401" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TLAB</text>
      <rect x="408" y="392" width="56" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="436" y="401" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KNOWLEDGE</text>
      <text x="436" y="428" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Knowledge Base</text>
      <text x="436" y="444" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sumber pengetahuan</text>

      <!-- Node: Komdigi (hosting / external) -->
      <rect x="720" y="384" width="200" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="720" y="384" width="200" height="80" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="728" y="392" width="48" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="752" y="401" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HOSTING</text>
      <text x="820" y="428" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Komdigi</text>
      <text x="820" y="444" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">environment hosting</text>

      <!-- ============ LEGEND ============ -->
      <line x1="40" y1="540" x2="960" y2="540" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">STATUS / DOMAIN</text>

      <rect x="40" y="568" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="60" y="576" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Existing System</text>

      <rect x="200" y="568" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="220" y="576" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">To Be Developed</text>

      <!-- TLab domain swatch (coral-tinted zone fill + tag) -->
      <rect x="348" y="562" width="22" height="16" rx="3" fill="rgba(235,108,54,0.05)" stroke="#eb6c36" stroke-width="0.8"/>
      <text x="380" y="575" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">TLab Domain</text>

      <rect x="476" y="568" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="496" y="576" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Hosting / External</text>

      <text x="560" y="576" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif" font-style="italic">Highlight coral menandai domain TLab (CMS RAGA &amp; Knowledge Base). Chatbot DPAD adalah fokus utama yang dikembangkan.</text>
    </svg>
  </div>
</body>
</html>
