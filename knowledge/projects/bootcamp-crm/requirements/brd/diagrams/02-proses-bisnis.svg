12" textLength="306.111">P08-P09 (Tenancy, Webhook) = proses pendukung</text><text x="392.228" y="1182.953" fill="#000" font-size="12" textLength="239.988">yang berjalan lintas semua fase di atas.</text><text x="392.228" y="1196.922" fill="#000" font-size="12" textLength="379.682">P11 (Asistensi AI) = lapisan MVP minimal, terpisah dari alur ini.</text><rect x="44.534" y="1147.846" width="321.693" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="54.534" y="1168.984" fill="#000" font-size="12" textLength="159.041">Core platform CRM selesai</text><text x="54.534" y="1182.953" fill="#000" font-size="12" textLength="301.693">(backend menyelesaikan seluruh fitur mandatory)</text><ellipse cx="205.381" cy="1235.752" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="205.381" cy="1235.752" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="205.381" y1="164.203" x2="205.381" y2="184.203" style="stroke:#181818;stroke-width:1;"/><polygon points="201.381,174.203,205.381,184.203,209.381,174.203,205.381,178.203" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="205.381" y1="218.172" x2="205.381" y2="238.172" style="stroke:#181818;stroke-width:1;"/><polygon points="201.381,228.172,205.381,238.172,209.381,228.172,205.381,232.172" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="294.914" y1="360.109" x2="294.914" y2="394.078" style="stroke:#181818;stroke-width:1;"/><polygon points="290.914,384.078,294.914,394.078,298.914,384.078,294.914,388.078" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="142.8" y1="304.141" x2="115.848" y2="304.141" style="stroke:#181818;stroke-width:1;"/><line x1="115.848" y1="304.141" x2="115.848" y2="326.141" style="stroke:#181818;stroke-width:1;"/><polygon points="111.848,316.141,115.