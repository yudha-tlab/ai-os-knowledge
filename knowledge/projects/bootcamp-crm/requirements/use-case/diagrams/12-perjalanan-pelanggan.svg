<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="369px" preserveAspectRatio="none" style="width:770px;height:369px;background:#FFFFFF;" version="1.1" viewBox="0 0 770 369" width="770px" zoomAndPan="magnify"><title>Tiga tahap perjalanan calon pelanggan di CRM kita</title><defs/><g><g class="title" data-source-line="2"><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="338.3926" x="209.0446" y="20.7803">Tiga tahap perjalanan calon pelanggan di CRM kita</text></g><!--entity A--><g class="entity" data-entity="A" data-source-line="4" data-uid="ent0002" id="entity_A"><rect fill="#DDE6FA" height="116" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="141.418" x="48.44" y="153"/><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="32.666" x="58.44" y="172.2402">LEAD</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="102.0469" x="58.44" y="184.2402">(belum tentu layak)</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="3.334" x="58.44" y="196.2402">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="115.4063" x="58.44" y="208.2402">Pertanyaan: layakkah</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="90.7207" x="58.44" y="220.2402">jadi Opportunity?</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="3.334" x="58.44" y="232.2402">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="51.3809" x="58.44" y="244.2402">Penanda:</text><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="66.7031" x="113.1548" y="244.2402">status kerja</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="83.373" x="58.44" y="256.2402">mis. Connected</text></g><!--entity B--><g class="entity" data-entity="B" data-source-line="5" data-uid="ent0003" id="entity_B"><rect fill="#CFE3FF" height="116" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="147.4238" x="336.29" y="42"/><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="86.6719" x="346.29" y="61.2402">OPPORTUNITY</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="120.0879" x="346.29" y="73.2402">(ada kebutuhan nyata)</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="3.334" x="346.29" y="85.2402">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="127.4238" x="346.29" y="97.2402">Pertanyaan: bagaimana</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="82.7109" x="346.29" y="109.2402">posisi pembeli?</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="3.334" x="346.29" y="121.2402">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="51.3809" x="346.29" y="133.2402">Penanda:</text><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="31.3477" x="401.0048" y="133.2402">stage</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="57.3398" x="346.29" y="145.2402">mis. Demo</text></g><!--entity C--><g class="entity" data-entity="C" data-source-line="6" data-uid="ent0004" id="entity_C"><rect fill="#DFF4EA" height="104" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="152.7617" x="611.72" y="47"/><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="68.666" x="621.72" y="66.2402">CUSTOMER</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="74.0156" x="621.72" y="78.2402">(Closed-Won)</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="3.334" x="621.72" y="90.2402">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="105.4102" x="621.72" y="102.2402">Pertanyaan: berapa</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="132.7617" x="621.72" y="114.2402">nilai yang dimenangkan?</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="3.334" x="621.72" y="126.2402">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="51.3809" x="621.72" y="138.2402">Penanda:</text><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="50.0215" x="676.4348" y="138.2402">Revenue</text></g><!--entity L--><g class="entity" data-entity="L" data-source-line="7" data-uid="ent0005" id="entity_L"><rect fill="#FDE8E6" height="44" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="106.7305" x="634.73" y="189"/><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="25.3301" x="644.73" y="208.2402">Lost</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="86.7305" x="644.73" y="220.2402">(dengan alasan)</text></g><g class="entity" data-entity="GMN11" data-source-line="14" data-uid="ent0012" id="entity_GMN11"><path d="M6,308 L6,358 A4,4 0 0 0 10,362 L228.2949,362 A4,4 0 0 0 232.2949,358 L232.2949,314 L222.2949,304 L123.15,304 L119.15,269.44 L115.15,304 L10,304 A4,4 0 0 0 6,308" fill="#FFF0D1" style="stroke:#D9A441;stroke-width:0.5;"/><path d="M222.2949,304 L222.2949,312 A2,2 0 0 0 224.2949,314 L232.2949,314 L222.2949,304" fill="#FFF0D1" style="stroke:#D9A441;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="205.2949" x="12" y="318.2402">HubSpot menyebut ini "lifecycle stage"</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="189.4043" x="12" y="330.2402">(Lead &#8594; Opportunity &#8594; Customer).</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="191.7422" x="12" y="342.2402">Di CRM kita tahap ini = jenis record,</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="170.7598" x="12" y="354.2402">jadi tidak perlu properti terpisah.</text></g><!--link A to B--><g class="link" data-entity-1="A" data-entity-2="B" data-source-line="8" data-uid="lnk6" id="link_A_B"><path d="M190.07,184.13 C234.24,167.16 285.5994,147.4226 330.3494,130.2226" fill="none" id="A-to-B" style="stroke:#0A7A54;stroke-width:2;"/><polygon fill="#0A7A54" points="335.95,128.07,326.1141,127.5652,331.2829,129.8638,328.9842,135.0326,335.95,128.07" style="stroke:#0A7A54;stroke-width:2;"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="42.0176" x="263.29" y="138.5302">Convert</text></g><!--link B to C--><g class="link" data-entity-1="B" data-entity-2="C" data-source-line="9" data-uid="lnk7" id="link_B_C"><path d="M483.91,99.74 C523.21,99.59 565.65,99.4427 605.38,99.2927" fill="none" id="B-to-C" style="stroke:#0A7A54;stroke-width:2;"/><polygon fill="#0A7A54" points="611.38,99.27,602.365,95.304,606.38,99.2889,602.3952,103.304,611.38,99.27" style="stroke:#0A7A54;stroke-width:2;"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="66.0234" x="514.72" y="95.6502">Closed-Won</text></g><!--link A to L--><g class="link" data-entity-1="A" data-entity-2="L" data-source-line="10" data-uid="lnk8" id="link_A_L"><path d="M190.24,211 C305.34,211 525.84,211 628.41,211" fill="none" id="A-to-L" style="stroke:#B42318;stroke-width:1;"/><polygon fill="#B42318" points="634.41,211,625.41,207,629.41,211,625.41,215,634.41,211" style="stroke:#B42318;stroke-width:1;"/></g><!--link L to A--><g class="link" data-entity-1="L" data-entity-2="A" data-source-line="12" data-uid="lnk10" id="link_L_A"><path d="M634.3,222.3 C593.42,230.44 535.27,240.72 483.72,245 C418.42,250.42 401.62,250.11 336.29,245 C287.06,241.15 237.9939,233.5094 195.8139,225.8694" fill="none" id="L-to-A" style="stroke:#122E7C;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#122E7C" points="189.91,224.8,198.053,230.34,194.8299,225.6911,199.4788,222.4681,189.91,224.8" style="stroke:#122E7C;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="70.7051" x="375.01" y="229.2402">buka kembali</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="57.3457" x="381.6897" y="241.2402">(Nurturing)</text></g><!--link B to L--><g class="link" data-entity-1="B" data-entity-2="L" data-source-line="11" data-uid="lnk9" id="link_B_L"><path d="M483.91,129.31 C531.2,148.32 586.1532,170.4115 628.8032,187.5615" fill="none" id="B-to-L" style="stroke:#B42318;stroke-width:1;"/><polygon fill="#B42318" points="634.37,189.8,627.5121,182.7311,629.731,187.9346,624.5275,190.1535,634.37,189.8" style="stroke:#B42318;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="64.0313" x="515.72" y="138.5302">Closed-Lost</text></g><!--SRC=[RPDTRjim3CVVVGekUMc2DbZRh2qAR4Fg5jY0j2dI5CEmx86sQ4UrJ1cMLC0Nw05sn9rab3Fq-yaMIP4__abzq9oRe0YSxmnDTAXDuhKt12jT8dZSO0CDjNTea94XHsDP378gIpah3Udo4YhjCJ5KUF0MMbrkl7XQohssdCIlX4lEmNWylvYTZyThtid8X1eyiGzWiCDgjEOrNrCh